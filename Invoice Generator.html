<!-- INVOICE GENERATOR SECTION -->
<section id="invoice" style="background:#fff; padding:40px 20px; margin-top:40px; border-radius:12px;">
  <h2 style="text-align:center; color:#0a74ed;">🧾 Triple-A Invoice Generator</h2>
  <p style="text-align:center; color:#555;">Send professional invoices and collect 50% deposit instantly</p>

  <div style="max-width:500px; margin:20px auto; background:#f8fafc; padding:20px; border-radius:10px; border:1px solid #e2e8f0;">
    <input type="text" id="clientName" placeholder="Client Name" style="padding:12px; width:100%; border:1px solid #ccc; border-radius:8px; margin:8px 0; box-sizing:border-box;">
    
    <input type="email" id="clientEmail" placeholder="Client Email" style="padding:12px; width:100%; border:1px solid #ccc; border-radius:8px; margin:8px 0; box-sizing:border-box;">
    
    <input type="text" id="project" placeholder="Project Description e.g Website Design" style="padding:12px; width:100%; border:1px solid #ccc; border-radius:8px; margin:8px 0; box-sizing:border-box;">
    
    <input type="number" id="amount" placeholder="Total Amount ₦" oninput="updatePay()" style="padding:12px; width:100%; border:1px solid #ccc; border-radius:8px; margin:8px 0; box-sizing:border-box;">
    
    <div style="background:#e6f0ff; padding:12px; border-radius:8px; margin:10px 0;">
      <p style="margin:0;"><b>Amount to Pay Now 50%:</b> ₦<span id="payAmount">0</span></p>
    </div>

    <button id="payInvoice" style="background:#0a74ed; color:#fff; padding:14px; width:100%; border:none; border-radius:8px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:10px;">
      Pay Invoice via Paystack
    </button>
  </div>
</section>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
function updatePay(){
  let amount = parseInt(document.getElementById('amount').value) || 0;
  document.getElementById('payAmount').innerText = (amount * 0.5).toLocaleString();
}

document.getElementById('payInvoice').onclick = function() {
  let amount = parseInt(document.getElementById('amount').value);
  let email = document.getElementById('clientEmail').value;
  let name = document.getElementById('clientName').value;
  
  if(!email || !amount){
    alert('Please enter client email and amount');
    return;
  }
  
  let deposit = amount * 0.5;
  
  var handler = PaystackPop.setup({
    key: 'pk_test_073da49110ff92bda2200e8418be9e', // TEST KEY
    email: email,
    amount: deposit * 100, // kobo
    currency: "NGN",
    ref: 'INV_'+Date.now(),
    metadata: {
      custom_fields: [
        {display_name: "Client Name", variable_name: "client_name", value: name},
        {display_name: "Project", variable_name: "project", value: document.getElementById('project').value}
      ]
    },
    callback: function(response){
      alert('Invoice Paid Successfully! \nRef: ' + response.reference);
    },
    onClose: function(){
      alert('Payment cancelled');
    }
  });
  handler.openIframe();
}
</script>
