<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triple-A Invoice Generator</title>
<style>
  body { font-family: Arial; background:#f8fafc; padding:20px; max-width:600px; margin:auto; }
  h2 { color:#0a74ed; text-align:center; }
  input, textarea { padding:12px; width:100%; border:1px solid #ccc; border-radius:8px; margin:8px 0; box-sizing:border-box; }
  .invoice { background:#fff; padding:20px; border-radius:10px; margin:15px 0; border:1px solid #e2e8f0; }
  button { background:#0a74ed; color:#fff; padding:14px; width:100%; border:none; border-radius:8px; font-weight:bold; font-size:16px; cursor:pointer; }
</style>
</head>
<body>

<h2>🧾 Triple-A Invoice Generator</h2>

<div class="invoice">
  <input type="text" id="clientName" placeholder="Client Name">
  <input type="email" id="clientEmail" placeholder="Client Email">
  <input type="text" id="project" placeholder="Project Description">
  <input type="number" id="amount" placeholder="Total Amount ₦" oninput="updatePay()">
  <p><b>Amount to Pay Now 50%:</b> ₦<span id="payAmount">0</span></p>
</div>

<button id="payInvoice">Pay Invoice via Paystack</button>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
function updatePay(){
  let amount = parseInt(document.getElementById('amount').value) || 0;
  document.getElementById('payAmount').innerText = (amount * 0.5).toLocaleString();
}

document.getElementById('payInvoice').onclick = function() {
  let amount = parseInt(document.getElementById('amount').value);
  let email = document.getElementById('clientEmail').value;
  let name = document.getElementById('clientName').value;
  
  if(!email || !amount){
    alert('Please enter client email and amount');
    return;
  }
  
  let deposit = amount * 0.5;
  
  var handler = PaystackPop.setup({
    key: 'pk_test_073da49110ff92bda2200e8418be9e',
    email: email,
    amount: deposit * 100,
    currency: "NGN",
    ref: 'INV_'+Date.now(),
    metadata: {
      custom_fields: [
        {display_name: "Client Name", variable_name: "client_name", value: name},
        {display_name: "Project", variable_name: "project", value: document.getElementById('project').value}
      ]
    },
    callback: function(response){
      alert('Invoice Paid! Ref: ' + response.reference + '\n\nSend this to Triple-A');
    },
    onClose: function(){
      alert('Payment cancelled');
    }
  });
  handler.openIframe();
}
</script>
</body>
</html>
