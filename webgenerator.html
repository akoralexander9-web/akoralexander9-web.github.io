<!DOCTYPE html>
<html>
<head>
  <title>Web Design Quote Generator | Alexander</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>body{font-family:Arial; max-width:600px; margin:auto; padding:20px; background:#f5f5f5;}
  .card{background:#fff; padding:20px; border-radius:10px;}
  button{background:#1e90ff; color:#fff; padding:12px; border:none; border-radius:6px; width:100%; cursor:pointer;}</style>
</head>
<body>
  <div class="card">
    <h2>🌐 Web Design Quote Generator</h2>
    <label><input type="checkbox" id="landing" value="50000"> Landing Page - ₦50,000</label><br>
    <label><input type="checkbox" id="ecom" value="200000"> E-commerce Site - ₦200,000</label><br>
    <label><input type="checkbox" id="hosting" value="20000"> 1 Year Hosting - ₦20,000</label><br><br>
    <button onclick="generate()">Generate Quote</button>
    <h3>Total: ₦<span id="total">0</span></h3>
    <a id="whatsapp" href="#" style="display:none; background:#25D366; color:#fff; padding:12px; text-align:center; border-radius:6px; text-decoration:none;">Send Quote to WhatsApp</a>
  </div>
<script>
function generate(){
  let total = 0;
  if(document.getElementById('landing').checked) total += 50000;
  if(document.getElementById('ecom').checked) total += 200000;
  if(document.getElementById('hosting').checked) total += 20000;
  document.getElementById('total').innerText = total;
  document.getElementById('whatsapp').style.display = 'block';
  document.getElementById('whatsapp').href = `https://wa.me/2347031257305?text=Hi%20Alexander%2C%20my%20website%20quote%20is%20%E2%82%A6${total}`;
}
</script>
</body>
</html>
