<!DOCTYPE html>
<html>
<head>
  <title>Poultry Tracker | Alexander</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial; max-width:700px; margin:auto; padding:20px; background:#f0fdf4;}
    h2{text-align:center; color:#0a7a2f;}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:15px; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
    input, button{width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; font-size:16px;}
    button{background:#0a7a2f; color:#fff; border:none; cursor:pointer; font-weight:bold;}
    button:hover{background:#065a22;}
    .profit{font-size:24px; color:#0a7a2f; font-weight:bold; text-align:center;}
    .loss{color:red;}
    table{width:100%; border-collapse:collapse; margin-top:10px;}
    td, th{border:1px solid #ddd; padding:8px; text-align:center;}
    th{background:#0a7a2f; color:#fff;}
  </style>
</head>
<body>
  <h2>🐔 Poultry Farm Tracker</h2>
  <p style="text-align:center;">Track expenses, sales and profit for your broilers</p>

  <div class="card">
    <h3>1. Add Expense</h3>
    <input id="item" placeholder="Item: e.g Day-old Chicks, Feed, Drugs, Vaccines">
    <input id="cost" type="number" placeholder="Cost ₦">
    <button onclick="addExpense()">Add Expense</button>
  </div>
  
  <div class="card">
    <h3>2. Add Sales</h3>
    <input id="birds" type="number" placeholder="Number of Birds Sold">
    <input id="price" type="number" placeholder="Price per Bird ₦">
    <button onclick="addSales()">Add Sales</button>
  </div>

  <div class="card">
    <h3>📊 Summary</h3>
    <p><b>Total Expenses:</b> ₦<span id="totalExp">0</span></p>
    <p><b>Total Sales:</b> ₦<span id="totalSales">0</span></p>
    <p class="profit">Profit/Loss: ₦<span id="profit">0</span></p>
    <button onclick="resetAll()" style="background:red;">Reset All</button>
  </div>

  <div class="card">
    <h3>Expense Log</h3>
    <table id="expTable"><tr><th>Item</th><th>Cost ₦</th></tr></table>
  </div>

<script>
let totalExp = 0;
let totalSales = 0;

function addExpense(){
  let item = document.getElementById('item').value;
  let cost = parseInt(document.getElementById('cost').value) || 0;
  if(item == "" || cost == 0) return alert("Please fill both fields");
  
  totalExp += cost;
  document.getElementById('totalExp').innerText = totalExp;
  document.getElementById('expTable').innerHTML += `<tr><td>${item}</td><td>${cost}</td></tr>`;
  updateProfit();
  document.getElementById('item').value = '';
  document.getElementById('cost').value = '';
}

function addSales(){
  let birds = parseInt(document.getElementById('birds').value) || 0;
  let price = parseInt(document.getElementById('price').value) || 0;
  if(birds == 0 || price == 0) return alert("Please fill both fields");
  
  let sales = birds * price;
  totalSales += sales;
  document.getElementById('totalSales').innerText = totalSales;
  updateProfit();
  document.getElementById('birds').value = '';
  document.getElementById('price').value = '';
}

function updateProfit(){
  let profit = totalSales - totalExp;
  document.getElementById('profit').innerText = profit;
  document.getElementById('profit').className = profit < 0 ? 'profit loss' : 'profit';
}

function resetAll(){
  if(confirm("Reset all data?")){
    totalExp = 0; totalSales = 0;
    document.getElementById('totalExp').innerText = 0;
    document.getElementById('totalSales').innerText = 0;
    document.getElementById('profit').innerText = 0;
    document.getElementById('expTable').innerHTML = "<tr><th>Item</th><th>Cost ₦</th></tr>";
  }
}
</script>
</body>
</html>
