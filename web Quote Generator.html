<!DOCTYPE html>
<html>
<head>
  <title>Website Cost Estimator | Alexander</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    body{font-family:Arial; max-width:650px; margin:auto; padding:20px; background:#eff6ff;}
    h2{text-align:center; color:#1d4ed8;}
    .card{background:#fff; padding:25px; border-radius:12px; margin-bottom:15px; box-shadow:0 3px 10px rgba(0,0,0,0.1);}
    label{display:block; margin:15px 0; font-weight:bold;}
    input, select{width:100%; padding:12px; border:2px solid #ddd; border-radius:8px; font-size:16px; margin-top:5px; box-sizing:border-box;}
    button{background:#1d4ed8; color:#fff; padding:15px; border:none; border-radius:8px; width:100%; cursor:pointer; font-size:18px; font-weight:bold;}
    button:hover{background:#1e40af;}
    .result{background:#dbeafe; padding:20px; border-radius:10px; text-align:center;}
    .total{font-size:32px; font-weight:bold; color:#1d4ed8;}
    .breakdown{text-align:left; margin:15px 0;}
    .whatsapp{display:block; background:#25D366; color:#fff; padding:14px; text-align:center; border-radius:8px; text-decoration:none; font-weight:bold; margin-top:10px;}
    .paystack{display:block; background:#00C3F3; color:#fff; padding:14px; text-align:center; border-radius:8px; text-decoration:none; font-weight:bold; margin-top:10px; border:none; width:100%; cursor:pointer; font-size:16px;}
    .paystack:disabled{background:#94a3b8; cursor:not-allowed;}
    #payStatus{text-align:center; margin-top:10px; font-size:14px; font-weight:bold;}
  </style>
</head>
<body>
  <div class="card">
    <h2>🌐 Website Cost Estimator</h2>
    <p>Get instant quote for your website project</p>
    
    <label>Your Name:
      <input id="clientName" type="text" placeholder="Enter your name" required>
    </label>

    <label>Your Email:
      <input id="clientEmail" type="email" placeholder="Enter your email" required>
    </label>
    
    <label>Website Type:
      <select id="type">
        <option value="50000">Landing Page - ₦50,000</option>
        <option value="120000">Business Website - ₦120,000</option>
        <option value="250000">E-commerce Store - ₦250,000</option>
        <option value="80000">Blog Website - ₦80,000</option>
      </select>
    </label>
    
    <label>Number of Pages:
      <input id="pages" type="number" value="5" min="1">
      <small>+₦10,000 per extra page after 5</small>
    </label>

    <label>Logo Design:
      <select id="logo">
        <option value="0">No Logo Design</option>
        <option value="15000">Yes + ₦15,000</option>
      </select>
    </label>
    
    <label>Hosting + Domain:
      <select id="hosting">
        <option value="0">I have my own</option>
        <option value="20000">1 Year Hosting + Domain + ₦20,000</option>
      </select>
    </label>

    <label>SEO Setup:
      <select id="seo">
        <option value="0">No SEO</option>
        <option value="30000">Basic SEO Setup + ₦30,000</option>
      </select>
    </label>

    <label>WhatsApp Chat Button:
      <select id="whatsappBtn">
        <option value="0">No</option>
        <option value="5000">Yes + ₦5,000</option>
      </select>
    </label>
    
    <button onclick="calculate()">Get My Quote</button>
  </div>
  
  <div class="card result" id="result" style="display:none;">
    <h3>Your Estimated Cost</h3>
    <p class="total">₦<span id="total">0</span></p>
    
    <div class="breakdown" id="breakdown"></div>
    
    <p style="background:#fef3c7; padding:10px; border-radius:8px; font-weight:bold;">Pay 50% Deposit: ₦<span id="deposit">0</span> to Start</p>
    
    <button class="paystack" id="payBtn" onclick="payWithPaystack()">💳 Pay 50% Deposit with Paystack</button>
    <a id="whatsapp" href="#" target="_blank" rel="noopener" class="whatsapp">📱 Send Quote to WhatsApp</a>
    <p id="payStatus"></p>
  </div>

  <div style="text-align:center; margin-top:20px;">
    <a href="index.html" style="color:#1d4ed8;">← Back to Portfolio</a>
  </div>

<script>
let globalTotal = 0;
let globalBreakdown = [];

function calculate(){
  let total = 0;
  let breakdown = [];
  
  let type = parseInt(document.getElementById('type').value);
  let typeName = document.getElementById('type').options[document.getElementById('type').selectedIndex].text;
  total += type;
  breakdown.push(typeName);
  
  let pages = parseInt(document.getElementById('pages').value);
  if(pages > 5){
    let extra = (pages - 5) * 10000;
    total += extra;
    breakdown.push(`${pages} Pages: +₦${extra.toLocaleString()}`);
  } else {
    breakdown.push(`${pages} Pages: Included`);
  }
  
  let items = ["logo", "hosting", "seo", "whatsappBtn"];
  items.forEach(id => {
    let val = parseInt(document.getElementById(id).value);
    let text = document.getElementById(id).options[document.getElementById(id).selectedIndex].text;
    if(val > 0){
      total += val;
      breakdown.push(text);
    }
  });
  
  globalTotal = total;
  globalBreakdown = breakdown;
  let deposit = Math.round(total * 0.5);
  
  document.getElementById('total').innerText = total.toLocaleString();
  document.getElementById('deposit').innerText = deposit.toLocaleString();
  document.getElementById('breakdown').innerHTML = breakdown.map(b => `✓ ${b}`).join('<br>');
  document.getElementById('result').style.display = 'block';
  
  let msg = `Hi Alexander, I need a website. Details: ${breakdown.join(', ')}. Total: ₦${total.toLocaleString()}. 50% Deposit: ₦${deposit.toLocaleString()}`;
  document.getElementById('whatsapp').href = `https://wa.me/2347031257305?text=${encodeURIComponent(msg)}`;
}

function payWithPaystack() {
  let name = document.getElementById('clientName').value.trim();
  let email = document.getElementById('clientEmail').value.trim();
  let payBtn = document.getElementById('payBtn');
  let status = document.getElementById('payStatus');
  
  if(!name || !email){
    status.innerText = "⚠️ Please enter your Name and Email first";
    status.style.color = "#dc2626";
    return;
  }
  
  let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!emailPattern.test(email)){
    status.innerText = "⚠️ Please enter a valid email address";
    status.style.color = "#dc2626";
    return;
  }
  
  let deposit = Math.round(globalTotal * 0.5);
  
  payBtn.disabled = true;
  status.innerText = "Opening payment window...";
  status.style.color = "#1d4ed8";
  
  let handler = PaystackPop.setup({
    key: 'pk_test_073da49110ff92bda2200e8418be9ededab11dde', // YOUR TEST KEY
    email: email,
    amount: deposit * 100, // kobo
    currency: "NGN",
    ref: 'WEB_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    metadata: {
      custom_fields: [
        {display_name: "Client Name", variable_name: "client_name", value: name},
        {display_name: "Project Details", variable_name: "project_details", value: globalBreakdown.join(', ')},
        {display_name: "Total Quote", variable_name: "total_quote", value: "₦" + globalTotal.toLocaleString()}
      ]
    },
    callback: function(response){
      payBtn.disabled = false;
      status.innerText = '✅ Payment Successful! Ref: ' + response.reference;
      status.style.color = "#16a34a";
      let successMsg = `Hi Alexander, I just paid 50% deposit of ₦${deposit.toLocaleString()}.%0ARef: ${response.reference}%0AProject: ${globalBreakdown.join(', ')}`;
      window.open(`https://wa.me/2347031257305?text=${encodeURIComponent(successMsg)}`, '_blank');
    },
    onClose: function(){
      payBtn.disabled = false;
      status.innerText = 'Payment window closed.';
      status.style.color = "#64748b";
    }
  });
  handler.openIframe();
}
</script>
</body>
</html>
