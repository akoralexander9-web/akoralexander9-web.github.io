<!DOCTYPE html>
<html>
<head>
  <title>Website Cost Estimator | Alexander</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial; max-width:650px; margin:auto; padding:20px; background:#eff6ff;}
    h2{text-align:center; color:#1d4ed8;}
    .card{background:#fff; padding:25px; border-radius:12px; margin-bottom:15px; box-shadow:0 3px 10px rgba(0,0,0,0.1);}
    label{display:block; margin:15px 0; font-weight:bold;}
    input, select{width:100%; padding:12px; border:2px solid #ddd; border-radius:8px; font-size:16px; margin-top:5px; box-sizing:border-box;}
    button{background:#1d4ed8; color:#fff; padding:15px; border:none; border-radius:8px; width:100%; cursor:pointer; font-size:18px; font-weight:bold;}
    button:hover{background:#1e40af;}
    .result{background:#dbeafe; padding:20px; border-radius:10px; text-align:center;}
    .total{font-size:32px; font-weight:bold; color:#1d4ed8;}
    .breakdown{text-align:left; margin:15px 0;}
    .whatsapp{display:block; background:#25D366; color:#fff; padding:14px; text-align:center; border-radius:8px; text-decoration:none; font-weight:bold; margin-top:10px;}
  </style>
</head>
<body>
  <div class="card">
    <h2>🌐 Website Cost Estimator</h2>
    <p>Get instant quote for your website project</p>
    
    <label>Website Type:
      <select id="type">
        <option value="50000">Landing Page - ₦50,000</option>
        <option value="120000">Business Website - ₦120,000</option>
        <option value="250000">E-commerce Store - ₦250,000</option>
        <option value="80000">Blog Website - ₦80,000</option>
      </select>
    </label>
    
    <label>Number of Pages:
      <input id="pages" type="number" value="5" min="1">
      <small>+₦10,000 per extra page after 5</small>
    </label>

    <label>Logo Design:
      <select id="logo">
        <option value="0">No Logo Design</option>
        <option value="15000">Yes + ₦15,000</option>
      </select>
    </label>
    
    <label>Hosting + Domain:
      <select id="hosting">
        <option value="0">I have my own</option>
        <option value="20000">1 Year Hosting + Domain + ₦20,000</option>
      </select>
    </label>

    <label>SEO Setup:
      <select id="seo">
        <option value="0">No SEO</option>
        <option value="30000">Basic SEO Setup + ₦30,000</option>
      </select>
    </label>

    <label>WhatsApp Chat Button:
      <select id="whatsappBtn">
        <option value="0">No</option>
        <option value="5000">Yes + ₦5,000</option>
      </select>
    </label>
    
    <button onclick="calculate()">Get My Quote</button>
  </div>
  
  <div class="card result" id="result" style="display:none;">
    <h3>Your Estimated Cost</h3>
    <p class="total">₦<span id="total">0</span></p>
    
    <div class="breakdown" id="breakdown"></div>
    
    <a id="whatsapp" href="#" class="whatsapp">📱 Send Quote to WhatsApp</a>
  </div>

  <div style="text-align:center; margin-top:20px;">
    <a href="/" style="color:#1d4ed8;">← Back to Portfolio</a>
  </div>

<script>
function calculate(){
  let total = 0;
  let breakdown = [];
  
  // Website Type
  let type = parseInt(document.getElementById('type').value);
  let typeName = document.getElementById('type').options[document.getElementById('type').selectedIndex].text;
  total += type;
  breakdown.push(typeName);
  
  // Pages
  let pages = parseInt(document.getElementById('pages').value);
  if(pages > 5){
    let extra = (pages - 5) * 10000;
    total += extra;
    breakdown.push(`${pages} Pages: +₦${extra.toLocaleString()}`);
  } else {
    breakdown.push(`${pages} Pages: Included`);
  }
  
  // All other dropdowns
  let items = ["logo", "hosting", "seo", "whatsappBtn"];
  items.forEach(id => {
    let val = parseInt(document.getElementById(id).value);
    let text = document.getElementById(id).options[document.getElementById(id).selectedIndex].text;
    if(val > 0){
      total += val;
      breakdown.push(text);
    }
  });
  
  document.getElementById('total').innerText = total.toLocaleString();
  document.getElementById('breakdown').innerHTML = breakdown.map(b => `✓ ${b}`).join('<br>');
  document.getElementById('result').style.display = 'block';
  
  let msg = `Hi Alexander, I need a website. Details: ${breakdown.join(', ')}. Total: ₦${total.toLocaleString()}`;
  document.getElementById('whatsapp').href = `https://wa.me/2347031257305?text=${encodeURIComponent(msg)}`;
}
</script>
</body>
</html>
